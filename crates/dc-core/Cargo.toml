[package]
name = "dc-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dc-domain = { path = "../dc-domain" }
dc-protocol = { path = "../dc-protocol" }
dc-store = { path = "../dc-store", features = ["sqlite"] }
dc-worker = { path = "../dc-worker" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing = { workspace = true }

[dev-dependencies]
dc-watchdog = { path = "../dc-watchdog" }
dc-broker = { path = "../dc-broker" }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[lints]
workspace = true
